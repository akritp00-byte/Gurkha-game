<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EXTINCT.io · dinosaur viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #cdeeff;
        font:
          600 14px system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: fixed;
        top: 8px;
        left: 12px;
        margin: 0;
        color: #1f3a2a;
      }
    </style>
  </head>
  <body>
    <p>
      Dev tool: every tier's dinosaur, walking on a turntable. ?static stops the motion,
      &amp;heading=1.57 turns them side-on, &amp;only=3 shows one tier up close, and
      &amp;pose=bite|roar|run|dead|carry tries an animation.
    </p>
    <canvas id="viewer"></canvas>
    <script type="module" src="./dinos.ts"></script>
  </body>
</html>
